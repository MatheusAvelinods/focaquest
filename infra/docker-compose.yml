# Sobe o FocaQuest completo: docker compose -f infra/docker-compose.yml up --build
# Acesse http://localhost:3000 (API em http://localhost:8080, Swagger em /swagger-ui.html).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: focaquest
      POSTGRES_USER: focaquest
      POSTGRES_PASSWORD: focaquest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focaquest"]
      interval: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      FOCAQUEST_DB_URL: jdbc:postgresql://db:5432/focaquest
      FOCAQUEST_DB_USER: focaquest
      FOCAQUEST_DB_PASSWORD: focaquest
      # Troque em qualquer ambiente compartilhado (>= 32 bytes).
      FOCAQUEST_JWT_SECRET: ${FOCAQUEST_JWT_SECRET:-local-compose-secret-change-me-0123456789}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: ../apps/web
      args:
        FOCAQUEST_API_URL: http://api:8080
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
