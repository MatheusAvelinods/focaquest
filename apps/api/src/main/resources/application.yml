spring:
  application:
    name: focaquest-api
  datasource:
    url: ${FOCAQUEST_DB_URL:jdbc:postgresql://localhost:5432/focaquest}
    username: ${FOCAQUEST_DB_USER:focaquest}
    password: ${FOCAQUEST_DB_PASSWORD:focaquest}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

focaquest:
  auth:
    # Sobrescreva em qualquer ambiente real: FOCAQUEST_JWT_SECRET (>= 32 bytes).
    jwt-secret: ${FOCAQUEST_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    token-ttl: ${FOCAQUEST_TOKEN_TTL:7d}
    secure-cookie: ${FOCAQUEST_SECURE_COOKIE:false}
  content:
    import-on-startup: ${FOCAQUEST_IMPORT_CONTENT:true}
    path: ${FOCAQUEST_CONTENT_PATH:../../content/tjpb-2026}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.focaquest: INFO
