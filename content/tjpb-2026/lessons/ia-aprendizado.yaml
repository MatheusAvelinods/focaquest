id: l.ia.aprendizado
topic: ia.aprendizado
title: Aprendizado de máquina — tipos de problema e sobreajuste
status: PUBLISHED
position: 1
reviewedAt: 2026-10-21
objective: Classificar problemas de aprendizado de máquina e diagnosticar sobreajuste.
explanation: |
  **Aprendizado supervisionado:** os dados têm rótulos (a resposta certa).

  - **classificação:** prevê uma categoria (assunto da petição, spam ou não);
  - **regressão:** prevê um número (tempo de tramitação em dias).

  **Aprendizado não supervisionado:** sem rótulos; busca estrutura nos dados.

  - **agrupamento** (k-means): reúne itens semelhantes;
  - **redução de dimensionalidade** (PCA).

  **Aprendizado por reforço:** um agente aprende por tentativa e erro, recebendo recompensas.

  **Sobreajuste (overfitting):** o modelo "decora" o treino — desempenho alto no treino e baixo
  em dados novos. Mitigações: mais dados, regularização, modelo mais simples, early stopping e
  **validação cruzada**. O **subajuste** é o oposto: o modelo vai mal até no treino.
example: |
  Um modelo prevê se um recurso será provido.
  Treino: 98% de acurácia. Validação: 68%.

  Diagnóstico: **sobreajuste**. Próximos passos: regularizar, reduzir atributos irrelevantes e
  avaliar com validação cruzada antes de qualquer uso em produção — com supervisão humana.
summary: Rótulo + categoria = classificação; rótulo + número = regressão; sem rótulo = agrupamento. Treino ótimo e teste ruim = sobreajuste.
