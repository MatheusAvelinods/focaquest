id: l.es.scrum
topic: es.scrum
title: Scrum em 3-5-3 — responsabilidades, eventos e artefatos
status: PUBLISHED
position: 1
reviewedAt: 2026-10-21
objective: Associar cada responsabilidade, evento e artefato do Scrum ao seu propósito, segundo o Guia do Scrum 2020.
explanation: |
  Uma forma de memorizar o Scrum é **3-5-3**: 3 responsabilidades, 5 eventos e 3 artefatos.

  **Responsabilidades (o Guia 2020 não fala mais em "papéis")**

  - **Product Owner:** maximiza o valor do produto e gerencia o Product Backlog;
  - **Scrum Master:** responde pela eficácia do Scrum Team e pelo entendimento do Scrum;
  - **Developers:** criam o Incremento e o plano da Sprint (Sprint Backlog).

  **Eventos:** Sprint (até 1 mês, contém os demais), Sprint Planning, Daily Scrum (15 min),
  Sprint Review e Sprint Retrospective.

  **Artefatos e seus compromissos**

  - Product Backlog → **Meta do Produto**;
  - Sprint Backlog → **Meta da Sprint**;
  - Incremento → **Definição de Pronto**.
example: |
  Na Daily, uma desenvolvedora percebe que a integração com o sistema de processos vai atrasar.
  Os **Developers** replanejam o Sprint Backlog para preservar a **Meta da Sprint**. Se a meta
  ficar inviável, conversam com o **Product Owner** — que é quem decide sobre o escopo do
  Product Backlog.
summary: PO = valor e backlog; SM = eficácia; Developers = Incremento. Cada artefato tem um compromisso.
