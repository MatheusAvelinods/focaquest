name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (unitários, conteúdo e integração)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      # Inclui ContentValidatorTest (valida content/) e, na fase verify, os testes *IT
      # com PostgreSQL efêmero via Testcontainers (Docker já disponível no runner).
      - working-directory: apps/api
        run: ./mvnw -B verify

  web:
    name: Web (tipos, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
